name: Chocolate Rabbit Build & Release

on:
  push:
    branches: [main]
    paths: ["chocolate-rabbit/**", ".github/workflows/chocolate-rabbit.yml"]
    tags: ["chocolate-rabbit-v*"]
  pull_request:
    paths: ["chocolate-rabbit/**", ".github/workflows/chocolate-rabbit.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chocolate-rabbit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/chocolate-rabbit-v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/chocolate-rabbit-v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' chocolate-rabbit/Directory.Build.props | head -n1)" >> "$GITHUB_OUTPUT"
          fi

      # A release is published when a chocolate-rabbit-v* tag is pushed, or when a push to main
      # (or a manual run) carries a version that has no release yet.
      - name: Decide whether to publish a release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.name }}
        run: |
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/chocolate-rabbit-v* ]]; then
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || { [[ "$GITHUB_EVENT_NAME" == "push" ]] && [[ "$GITHUB_REF" == "refs/heads/main" ]]; }; then
            if gh release view "chocolate-rabbit-v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release chocolate-rabbit-v$V already exists; building only."
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Publish release chocolate-rabbit-v$V: $publish"

      - name: Publish (self-contained, x64)
        env:
          V: ${{ steps.ver.outputs.name }}
        run: |
          dotnet publish chocolate-rabbit/TheChocolateRabbit/TheChocolateRabbit.csproj -c Release -r win-x64 --self-contained true \
            -p:Version="$V" -p:GitHubRepo="${GITHUB_REPOSITORY}" -p:DebugType=none -p:DebugSymbols=false \
            -o out/TheChocolateRabbit

      - name: Package
        id: pkg
        env:
          V: ${{ steps.ver.outputs.name }}
        run: |
          OUT="The-Chocolate-Rabbit-Windows-${V}-x64.zip"
          (cd out/TheChocolateRabbit && 7z a -tzip -mx=6 "../../$OUT" . >/dev/null)
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$OUT")" >> "$GITHUB_OUTPUT"
          echo "Built $OUT ($(stat -c%s "$OUT") bytes)"

      # Inno Setup is preinstalled on the windows-latest runner.
      - name: Build installer
        id: setup
        env:
          V: ${{ steps.ver.outputs.name }}
        run: |
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$V" "/DSourceDir=$(cygpath -w "$PWD/out/TheChocolateRabbit")" "/DOutputDir=$(cygpath -w "$PWD/out")" "$(cygpath -w "$PWD/chocolate-rabbit/installer/TheChocolateRabbit.iss")"
          OUT="The-Chocolate-Rabbit-Setup-${V}.exe"
          mv "out/$OUT" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$OUT")" >> "$GITHUB_OUTPUT"
          echo "Built $OUT ($(stat -c%s "$OUT") bytes)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: The-Chocolate-Rabbit-Windows-${{ steps.ver.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.path }}
            ${{ steps.setup.outputs.path }}

      - name: Extract changelog for this version
        if: steps.rel.outputs.publish == 'true'
        run: |
          V="${{ steps.ver.outputs.name }}"
          awk -v v="$V" '
            /^## / { if (found) exit; if (index($0, "v" v) > 0) { found=1; next } }
            found { print }
          ' chocolate-rabbit/CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then echo "The Chocolate Rabbit for Windows v$V" > RELEASE_NOTES.md; fi
          echo "---- release notes ----"; cat RELEASE_NOTES.md

      - name: Publish GitHub release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chocolate-rabbit-v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: The Chocolate Rabbit for Windows ${{ steps.ver.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.setup.outputs.path }}
            ${{ steps.pkg.outputs.path }}
          fail_on_unmatched_files: true

      # The in-app updater reads release/update-chocolate-rabbit.json from main, so publish the
      # feed only after the release and its assets exist.
      - name: Update release feed on main
        if: steps.rel.outputs.publish == 'true'
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          ASSET: ${{ steps.pkg.outputs.path }}
          SHA256: ${{ steps.pkg.outputs.sha256 }}
          SIZE: ${{ steps.pkg.outputs.size }}
          SETUP_ASSET: ${{ steps.setup.outputs.path }}
          SETUP_SHA256: ${{ steps.setup.outputs.sha256 }}
          SETUP_SIZE: ${{ steps.setup.outputs.size }}
        run: |
          set -euo pipefail
          IFS=. read -r MAJ MIN PAT <<< "$VERSION_NAME"
          CODE=$(( ${MAJ%%[^0-9]*} * 10000 + ${MIN%%[^0-9]*} * 100 + ${PAT%%[^0-9]*} ))
          git fetch origin main
          git checkout -B main origin/main
          CURRENT=$(python -c "import json;print(json.load(open('release/update-chocolate-rabbit.json'))['versionCode'])")
          if [ "$CODE" -le "$CURRENT" ]; then
            echo "::error::versionCode $CODE is not newer than the feed's $CURRENT; not updating release/update-chocolate-rabbit.json."
            exit 1
          fi
          cat > release/update-chocolate-rabbit.json <<JSON
          {
            "schemaVersion": 1,
            "packageName": "ca.thechocolaterabbit.app.windows",
            "versionName": "$VERSION_NAME",
            "versionCode": $CODE,
            "setup": {
              "assetName": "$SETUP_ASSET",
              "sha256": "$SETUP_SHA256",
              "sizeBytes": $SETUP_SIZE
            },
            "zip": {
              "assetName": "$ASSET",
              "sha256": "$SHA256",
              "sizeBytes": $SIZE
            }
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/update-chocolate-rabbit.json
          git commit -m "Publish The Chocolate Rabbit for Windows $VERSION_NAME update feed"
          for i in 1 2 3 4; do
            if git push origin main; then exit 0; fi
            echo "push rejected; rebasing and retrying ($i)"
            git fetch origin main && git rebase origin/main
          done
          exit 1
