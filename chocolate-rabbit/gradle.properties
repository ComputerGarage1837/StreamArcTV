org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# App configuration
# VERSION_NAME drives the Android versionCode (major*10000 + minor*100 + patch),
# which must always be higher than the versionCode in ../release/update-chocolate-rabbit.json.
VERSION_NAME=1.0.0
# Repository that hosts release/update-chocolate-rabbit.json and the GitHub Releases
# (tagged chocolate-rabbit-v<version>) with the APKs.
GITHUB_REPO=ComputerGarage1837/StreamArcTV
# Where newsletter sign-ups are sent until the newsletter service is live.
NEWSLETTER_EMAIL=info@thechocolaterabbit.ca
