org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# App configuration
# VERSION_NAME drives the Android versionCode (major*10000 + minor*100 + patch),
# which must always be higher than the versionCode in release/update.json.
VERSION_NAME=1.0.8
# Repository that hosts release/update.json and the GitHub Releases with APKs.
GITHUB_REPO=ComputerGarage1837/StreamArcTV

# Xtream Codes servers (hard-coded per product requirements; override with -P if needed)
LIVE_URL=https://mediahere.ca/
VOD_URL=https://onlypuds.fans:2083/
