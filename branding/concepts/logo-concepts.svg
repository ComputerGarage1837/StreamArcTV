<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1160" viewBox="0 0 1400 1160" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <linearGradient id="gSun" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#FDE047"/></linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E3A8A"/><stop offset="1" stop-color="#0A1628"/></linearGradient>
    <clipPath id="clipA"><rect x="70" y="120" width="240" height="240" rx="48"/></clipPath>
  </defs>
  <rect width="1400" height="1160" fill="#0A1628"/>
  <text x="60" y="70" fill="#F8FAFC" font-size="34" font-weight="700">Stream Arc TV — logo concepts</text>
  <text x="60" y="100" fill="#94A3B8" font-size="17">Pick a letter. Each card shows the launcher icon (left) and the wordmark lock-up (right).</text>

  <!-- A: current -->
  <rect x="40" y="130" width="640" height="300" rx="20" fill="#132A4F"/>
  <text x="60" y="165" fill="#5EEAD4" font-size="15" font-weight="700" letter-spacing="2">A · CURRENT (already in the repo)</text>
  <image x="70" y="180" width="200" height="200" xlink:href="../stream-arc-tv-icon.png"/>
  <image x="300" y="185" width="350" height="230" xlink:href="../stream-arc-tv-logo.png"/>

  <!-- B: Arc ring + play (minimal, flat) -->
  <rect x="720" y="130" width="640" height="300" rx="20" fill="#132A4F"/>
  <text x="740" y="165" fill="#5EEAD4" font-size="15" font-weight="700" letter-spacing="2">B · ARC RING — flat, minimal, TV-safe</text>
  <g transform="translate(750,180)">
    <rect width="200" height="200" rx="44" fill="url(#gNavy)"/>
    <path d="M40 120 A60 60 0 0 1 160 120" fill="none" stroke="url(#gBlue)" stroke-width="18" stroke-linecap="round"/>
    <path d="M72 120 A28 28 0 0 1 128 120" fill="none" stroke="#5EEAD4" stroke-width="14" stroke-linecap="round"/>
    <path d="M86 118 l0 46 l40 -23 z" fill="#F8FAFC"/>
  </g>
  <g transform="translate(985,230)">
    <path d="M10 70 A40 40 0 0 1 90 70" fill="none" stroke="url(#gBlue)" stroke-width="12" stroke-linecap="round"/>
    <path d="M38 68 l0 30 l26 -15 z" fill="#F8FAFC"/>
    <text x="110" y="85" fill="#F8FAFC" font-size="44" font-weight="800">Stream Arc<tspan fill="#5EEAD4"> TV</tspan></text>
  </g>

  <!-- C: Signal waves TV -->
  <rect x="40" y="460" width="640" height="300" rx="20" fill="#132A4F"/>
  <text x="60" y="495" fill="#5EEAD4" font-size="15" font-weight="700" letter-spacing="2">C · BROADCAST — screen with signal arcs</text>
  <g transform="translate(70,510)">
    <rect width="200" height="200" rx="44" fill="#0F2140"/>
    <rect x="40" y="70" width="120" height="84" rx="14" fill="url(#gBlue)"/>
    <rect x="52" y="82" width="96" height="60" rx="8" fill="#0A1628"/>
    <path d="M100 138 v22 M70 172 h60" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <path d="M100 58 A34 34 0 0 1 134 92" fill="none" stroke="#5EEAD4" stroke-width="8" stroke-linecap="round" transform="rotate(-45 100 92)"/>
    <path d="M100 36 A56 56 0 0 1 156 92" fill="none" stroke="#5EEAD4" stroke-width="8" stroke-linecap="round" opacity=".6" transform="rotate(-45 100 92)"/>
    <path d="M88 100 l0 26 l22 -13 z" fill="#5EEAD4"/>
  </g>
  <g transform="translate(300,560)">
    <rect x="0" y="20" width="70" height="50" rx="9" fill="url(#gBlue)"/>
    <rect x="8" y="28" width="54" height="34" rx="5" fill="#132A4F"/>
    <path d="M30 40 l0 12 l12 -6 z" fill="#5EEAD4"/>
    <text x="90" y="62" fill="#F8FAFC" font-size="40" font-weight="800">STREAM ARC</text>
    <text x="90" y="100" fill="#5EEAD4" font-size="26" font-weight="600" letter-spacing="10">TELEVISION</text>
  </g>

  <!-- D: Sunset arc horizon -->
  <rect x="720" y="460" width="640" height="300" rx="20" fill="#132A4F"/>
  <text x="740" y="495" fill="#5EEAD4" font-size="15" font-weight="700" letter-spacing="2">D · HORIZON — warm arc, cinematic</text>
  <g transform="translate(750,510)">
    <rect width="200" height="200" rx="44" fill="url(#gNavy)"/>
    <path d="M30 140 A70 70 0 0 1 170 140 Z" fill="url(#gSun)"/>
    <rect x="20" y="140" width="160" height="14" rx="7" fill="#0A1628"/>
    <path d="M60 140 A40 40 0 0 1 140 140" fill="none" stroke="#0A1628" stroke-width="6" opacity=".35"/>
    <path d="M90 96 l0 34 l30 -17 z" fill="#0A1628"/>
  </g>
  <g transform="translate(985,560)">
    <path d="M0 70 A40 40 0 0 1 80 70 Z" fill="url(#gSun)"/>
    <text x="100" y="66" fill="#F8FAFC" font-size="42" font-weight="800">Stream Arc</text>
    <text x="100" y="104" fill="#FDE047" font-size="26" font-weight="700" letter-spacing="6">TV</text>
  </g>

  <!-- E: Monogram S-arc -->
  <rect x="40" y="790" width="640" height="300" rx="20" fill="#132A4F"/>
  <text x="60" y="825" fill="#5EEAD4" font-size="15" font-weight="700" letter-spacing="2">E · MONOGRAM — S built from two arcs</text>
  <g transform="translate(70,840)">
    <rect width="200" height="200" rx="44" fill="#0F2140"/>
    <path d="M140 62 A40 40 0 1 0 100 102 A40 40 0 1 1 60 142" fill="none" stroke="url(#gTeal)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="140" cy="62" r="11" fill="#F8FAFC"/>
    <circle cx="60" cy="142" r="11" fill="#F8FAFC"/>
  </g>
  <g transform="translate(300,860)">
    <path d="M60 20 A22 22 0 1 0 38 42 A22 22 0 1 1 16 64" fill="none" stroke="url(#gTeal)" stroke-width="11" stroke-linecap="round"/>
    <text x="90" y="58" fill="#F8FAFC" font-size="44" font-weight="800">stream arc</text>
    <text x="92" y="92" fill="#5EEAD4" font-size="22" font-weight="600" letter-spacing="8">TV · LIVE &amp; ON DEMAND</text>
  </g>

  <!-- Notes -->
  <rect x="720" y="790" width="640" height="300" rx="20" fill="#0F2140" stroke="#1E3A5F"/>
  <text x="740" y="825" fill="#F8FAFC" font-size="17" font-weight="700">Notes</text>
  <text x="740" y="860" fill="#94A3B8" font-size="15">• A is what ships today (launcher icon, banner, in-app wordmark).</text>
  <text x="740" y="888" fill="#94A3B8" font-size="15">• B–E are vector, so they scale cleanly to every Android TV size.</text>
  <text x="740" y="916" fill="#94A3B8" font-size="15">• B and E match the app's teal/navy UI palette; D changes the palette.</text>
  <text x="740" y="944" fill="#94A3B8" font-size="15">• Reply with a letter and I'll generate the full icon set, TV banner</text>
  <text x="740" y="968" fill="#94A3B8" font-size="15">  and in-app wordmark, then ship it in the next release.</text>
</svg>
